<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Editar Clínica</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>
	<div class="container mt-5">
		<h2 class="mb-4">Editar Clínica</h2>
		<form th:action="@{/clinica/atualizar}" th:object="${clinica}"
			method="post">
			<div class="mb-3">
				<label for="nome" class="form-label">Nome</label> <input type="text"
					id="nome" th:field="*{nome}" class="form-control">
				<div th:if="${#fields.hasErrors('nome')}" th:errors="*{nome}"
					class="text-danger"></div>
			</div>
			<div class="mb-3">
				<label for="cnpj" class="form-label">CNPJ</label> <input type="text"
					id="cnpj" th:field="*{cnpj}" class="form-control">
				<div th:if="${#fields.hasErrors('cnpj')}" th:errors="*{cnpj}"
					class="text-danger"></div>
			</div>
			<div class="mb-3">
				<label for="email" class="form-label">E-mail</label> <input
					type="email" id="email" th:field="*{email}" class="form-control">
				<div th:if="${#fields.hasErrors('email')}" th:errors="*{email}"
					class="text-danger"></div>
			</div>
			<div class="mb-3">
				<label for="senha" class="form-label">Senha</label> <input
					type="password" id="senha" th:field="*{senha}" class="form-control">
				<div th:if="${#fields.hasErrors('senha')}" th:errors="*{senha}"
					class="text-danger"></div>
			</div>
			<button type="submit" class="btn btn-primary">Salvar
				alterações</button>
			<a th:href="@{/clinica/perfil}" class="btn btn-secondary">
				Cancelar </a>
		</form>
	</div>
</body>
</html>
