<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cadastro de Clínica</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>

	<div class="container mt-5" style="max-width: 500px;">

		<h1>Cadastro de Clínica</h1>

		<form th:object="${clinica}" th:action="@{/cadastrar_clinica}"
			method="post">

			<input type="hidden" name="_csrf" th:value="${_csrf.token}">

			<div class="mb-3">
				<label for="nome" class="form-label">Nome da Clínica:</label> <input
					id="nome" class="form-control" type="text" th:field="*{nome}">
				<div style="color: red;" th:if="${#fields.hasErrors('nome')}"
					th:errors="*{nome}"></div>
			</div>

			<div class="mb-3">
				<label for="cnpj" class="form-label">CNPJ:</label> <input id="cnpj"
					class="form-control" type="text" th:field="*{cnpj}"
					placeholder="00.000.000/0000-00">
				<div style="color: red;" th:if="${#fields.hasErrors('cnpj')}"
					th:errors="*{cnpj}"></div>
			</div>

			<div class="mb-3">
				<label for="email" class="form-label">Email:</label> <input
					id="email" class="form-control" type="email" th:field="*{email}">
				<div style="color: red;" th:if="${#fields.hasErrors('email')}"
					th:errors="*{email}"></div>
			</div>

			<div class="mb-3">
				<label for="senha" class="form-label">Senha:</label> <input
					id="senha" class="form-control" type="password" th:field="*{senha}">
				<div style="color: red;" th:if="${#fields.hasErrors('senha')}"
					th:errors="*{senha}"></div>
			</div>

			<button type="submit" class="btn btn-primary">Cadastrar</button>

		</form>

		<p class="mt-3">
			Já tem cadastro? <a th:href="@{/login}">Fazer login</a>
		</p>

	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
