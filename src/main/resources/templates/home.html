<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Home</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="/home">Clyvo</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav">
                <li class="nav-item" th:if="${clinica != null}">
                    <a class="nav-link" href="/clinica/veterinarios" >Veterinários</a>
                </li>
                <li class="nav-item" th:if="${clinica != null}">
                    <a class="nav-link" href="/clinica/perfil">Perfil</a>
                </li>

					<li class="nav-item" th:if="${veterinario != null}">
						<a class="nav-link" href="/veterinario/minhas-consultas">Minhas Consultas</a>
					</li>
					<li class="nav-item" th:if="${veterinario != null}"><a
						class="nav-link" href="/veterinario/perfil">Perfil</a></li>
			</ul>
        </div>
        <form th:action="@{/logout}" method="post" class="d-flex">
            <input type="hidden" name="_csrf" th:value="${_csrf.token}">
            <button type="submit" class="btn btn-outline-light btn-sm">Sair</button>
        </form>
    </div>
</nav>

<div class="container mt-4">

    <div class="row" th:if="${clinica != null}">
        <h1>Bem-vinda, <span th:text="${clinica.nome}" ></span>!</h1>
        <p class="text-muted">Use o menu acima para navegar.</p>
    </div>
        <div class="row" th:if="${ veterinario != null }">
        <h1>Bem-vindo, Vet. <span th:text="${veterinario.nome}"></span>!</h1>
        <p class="text-muted">Use o menu acima para navegar.</p>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
