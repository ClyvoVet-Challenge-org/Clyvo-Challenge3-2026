<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Meu Perfil - Clyvo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container-fluid">

        <a class="navbar-brand" href="/home">
            Clyvo
        </a>

        <div class="collapse navbar-collapse">

            <ul class="navbar-nav me-auto">
            
                	<li class="nav-item">

                    <a class="nav-link"
                       href="/vet/minhas-consultas">

                        Minhas Consultas

                    </a>

                </li>

                <li class="nav-item">
                    <a class="nav-link active" href="/vet/perfil">
                        Meu Perfil
                    </a>
                </li>

            </ul>

            <form th:action="@{/logout}"
                  method="post">

                <input type="hidden"
                       name="_csrf"
                       th:value="${_csrf.token}">

                <button type="submit"
                        class="btn btn-outline-light">
                    Sair
                </button>

            </form>

        </div>

    </div>

</nav>


<div class="container mt-5">

    <div class="row justify-content-center">

        <div class="col-lg-8">

            <div class="card shadow-sm">

                <div class="card-header bg-dark text-white text-center">

                    <h2 class="mb-0">
                        Meu Perfil
                    </h2>

                </div>


                <div class="card-body p-4">

                    <div class="text-center mb-4">

                        <h3 th:text="${veterinario.nome}">
                            Nome do Veterinário
                        </h3>

                        <span class="badge bg-success">
                            Veterinário
                        </span>

                    </div>

                    <hr>


                    <h5 class="mb-4">
                        Dados pessoais
                    </h5>


                    <div class="row">

                        <div class="col-md-6 mb-4">

                            <label class="fw-bold">
                                Nome
                            </label>

                            <p th:text="${veterinario.nome}">
                                Nome
                            </p>

                        </div>


                        <div class="col-md-6 mb-4">

                            <label class="fw-bold">
                                CPF
                            </label>

                            <p th:text="${veterinario.cpf}">
                                CPF
                            </p>

                        </div>


                        <div class="col-md-6 mb-4">

                            <label class="fw-bold">
                                CRMV
                            </label>

                            <p th:text="${veterinario.crmv}">
                                CRMV
                            </p>

                        </div>


                        <div class="col-md-6 mb-4">

                            <label class="fw-bold">
                                E-mail
                            </label>

                            <p th:text="${veterinario.email}">
                                E-mail
                            </p>

                        </div>

                    </div>


                    <hr>


                    <div class="d-flex justify-content-between mt-4">


                        <a href="/vet/edicao"
                           class="btn btn-primary">
                            Editar perfil
                        </a>

                    </div>

                </div>

            </div>

        </div>

    </div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>

</body>

</html>
