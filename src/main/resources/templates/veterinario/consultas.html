<!DOCTYPE html>
<html lang="pt-BR"
      xmlns:th="http://www.thymeleaf.org">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Minhas Consultas - Clyvo</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>


<body class="bg-light">


<!-- NAVBAR -->

<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

    <div class="container-fluid">

        <a class="navbar-brand"
           href="/home">

            Clyvo

        </a>


        <div class="collapse navbar-collapse">

            <ul class="navbar-nav me-auto">


                <li class="nav-item">

                    <a class="nav-link"
                       href="/vet/perfil">

                        Meu Perfil

                    </a>

                </li>


                <li class="nav-item">

                    <a class="nav-link active"
                       href="/vet/consultas">

                        Minhas Consultas

                    </a>

                </li>

            </ul>

        </div>

    </div>

</nav>



<!-- CONTEÚDO -->

<div class="container mt-5">


    <div class="mb-4">

        <h2>
            Minhas Consultas
        </h2>

        <p class="text-muted">
            Consulte seus atendimentos, animais e clínicas associadas.
        </p>

    </div>



    <!-- SEM CONSULTAS -->

    <div th:if="${consultas == null || consultas.isEmpty()}"
         class="alert alert-info">

        Você ainda não possui consultas cadastradas.

    </div>



    <!-- CONSULTAS -->

    <div th:if="${consultas != null && !consultas.isEmpty()}">

        <div class="row g-4">


            <div class="col-12"
                 th:each="consulta : ${consultas}">


                <div class="card shadow-sm">


                    <!-- CABEÇALHO -->

                    <div class="card-header
                                d-flex
                                justify-content-between
                                align-items-center">

                        <div>

                            <h5 class="mb-1">
                                Consulta
                            </h5>

                            <small class="text-muted"
                                   th:text="${#temporals.format(consulta.dataConsulta, 'dd/MM/yyyy')}">

                                01/01/2026

                            </small>

                        </div>


                        <span class="badge bg-primary"
                              th:text="${consulta.statusConsulta}">

                            Status

                        </span>

                    </div>



                    <!-- CORPO -->

                    <div class="card-body">


                        <div class="row">


                            <!-- ANIMAL -->

                            <div class="col-md-4 mb-4">

                                <label class="fw-bold">
                                    Animal
                                </label>

                                <p class="mb-0"
                                   th:text="${consulta.animal.nome}">

                                    Nome do animal

                                </p>

                            </div>



                            <!-- RESPONSÁVEL -->

                            <div class="col-md-4 mb-4">

                                <label class="fw-bold">
                                    Responsável
                                </label>

                                <p class="mb-0"
                                   th:text="${consulta.animal.responsavel.nome}">

                                    Nome do responsável

                                </p>

                            </div>



                            <!-- CLÍNICA -->

                            <div class="col-md-4 mb-4">

                                <label class="fw-bold">
                                    Clínica
                                </label>

                                <p class="mb-0"
                                   th:text="${consulta.veterinarioClinica.clinica.nome}">

                                    Nome da clínica

                                </p>

                            </div>


                        </div>



                        <div class="row">


                            <!-- CNPJ -->

                            <div class="col-md-4 mb-3">

                                <label class="fw-bold">
                                    CNPJ da clínica
                                </label>

                                <p class="mb-0"
                                   th:text="${consulta.veterinarioClinica.clinica.cnpj}">

                                    CNPJ

                                </p>

                            </div>



                            <!-- DATA -->

                            <div class="col-md-4 mb-3">

                                <label class="fw-bold">
                                    Data da consulta
                                </label>

                                <p class="mb-0"
                                   th:text="${#temporals.format(consulta.dataConsulta, 'dd/MM/yyyy')}">

                                    01/01/2026

                                </p>

                            </div>



                            <!-- STATUS -->

                            <div class="col-md-4 mb-3">

                                <label class="fw-bold">
                                    Status
                                </label>

                                <p class="mb-0"
                                   th:text="${consulta.statusConsulta}">

                                    Agendada

                                </p>

                            </div>


                        </div>



                        <hr>



                        <!-- HISTÓRICO -->

                        <div>

                            <label class="fw-bold mb-2">
                                Histórico da consulta
                            </label>

                            <div class="bg-light border rounded p-3">

                                <p class="mb-0"
                                   th:text="${consulta.historico}">

                                    Histórico da consulta.

                                </p>

                            </div>

                        </div>


                    </div>

                </div>

            </div>


        </div>

    </div>


</div>



<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js">
</script>


</body>

</html>
