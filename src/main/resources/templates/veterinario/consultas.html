<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Minhas Consultas - Clyvo</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>

<body class="bg-light">

	<!-- NAVBAR -->
	<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
		<div class="container-fluid">
			<a class="navbar-brand" th:href="@{/home}">Clyvo</a>

			<div class="collapse navbar-collapse">
				<ul class="navbar-nav me-auto">
					<li class="nav-item"><a class="nav-link active"
						th:href="@{/vet/minhas-consultas}">Minhas Consultas</a></li>
					<li class="nav-item"><a class="nav-link"
						th:href="@{/vet/perfil}">Meu Perfil</a></li>
				</ul>
			</div>
			<form th:action="@{/logout}" method="post">
				<input type="hidden" name="_csrf" th:value="${_csrf.token}">
				<button type="submit" class="btn btn-outline-light">Sair</button>
			</form>
		</div>
	</nav>

	<!-- CONTEÚDO -->
	<div class="container mt-5 mb-5">

		<div
			class="d-flex flex-wrap justify-content-between align-items-end gap-3 mb-4">
			<div>
				<h2 class="mb-1">Minhas Consultas</h2>
				<p class="text-muted mb-0"
					th:text="${consultas == null ? 0 : consultas.size()} + ' consulta(s) cadastrada(s)'">
					0 consulta(s) cadastrada(s)</p>
			</div>

			<!--         <input id="filtro" type="search" class="form-control" style="max-width: 280px;"
               placeholder="Buscar por animal ou responsável"
               th:if="${consultas != null && !consultas.isEmpty()}"> -->
		</div>

		<!-- SEM CONSULTAS -->
		<div th:if="${consultas == null || consultas.isEmpty()}"
			class="alert alert-info">Você ainda não possui consultas
			cadastradas.</div>

		<!-- LISTA -->
		<div th:if="${consultas != null && !consultas.isEmpty()}"
			class="card shadow-sm">
			<div class="table-responsive">
				<table class="table table-hover align-middle mb-0">
					<thead class="table-light">
						<tr>
							<th scope="col">Data</th>
							<th scope="col">Animal</th>
							<th scope="col">Responsável</th>
						</tr>
					</thead>

					<tbody id="listaConsultas">
						<tr th:each="consulta : ${consultas}">
							<td class="text-nowrap"
								th:text="${#temporals.format(consulta.dataConsulta, 'dd/MM/yyyy')}">
								01/01/2026</td>

							<td><a class="fw-semibold text-decoration-none"
								th:href="@{/animais/{id}(id=${consulta.animal.id})}"
								th:text="${consulta.animal.nome}"> Nome do animal </a></td>

							<td><a class="text-decoration-none"
								th:href="@{/responsaveis/{id}(id=${consulta.animal.responsavel.id})}"
								th:text="${consulta.animal.responsavel.nome}"> Nome do
									responsável </a></td>
						</tr>
					</tbody>
				</table>
			</div>

			<div id="semResultado" class="p-3 text-muted d-none">Nenhuma
				consulta encontrada para essa busca.</div>
		</div>

	</div>

	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

	<!-- Filtro simples no navegador (não consulta o servidor) -->
	<script>
    const filtro = document.getElementById('filtro');
    if (filtro) {
        const linhas = document.querySelectorAll('#listaConsultas tr');
        const aviso = document.getElementById('semResultado');

        filtro.addEventListener('input', () => {
            const termo = filtro.value.trim().toLowerCase();
            let visiveis = 0;

            linhas.forEach(linha => {
                const mostrar = linha.textContent.toLowerCase().includes(termo);
                linha.classList.toggle('d-none', !mostrar);
                if (mostrar) visiveis++;
            });

            aviso.classList.toggle('d-none', visiveis > 0);
        });
    }
</script>

</body>
</html>
