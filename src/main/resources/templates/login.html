<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Login</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css"
	rel="stylesheet">
</head>
<body>
	<div class="container mt-5" style="max-width: 400px;">
		<h1>Login</h1>

		<div class="alert alert-danger" th:if="${param.error}">Usuário
			ou senha inválidos.</div>
		<div class="alert alert-success" th:if="${param.logout}">Você
			saiu com sucesso.</div>

		<form th:action="@{/login}" method="post">
			<div class="mb-3">
				<label for="username" class="form-label">Email:</label> <input
					id="username" name="username" type="email" class="form-control"
					required autofocus>
			</div>

			<div class="mb-3">
				<label for="password" class="form-label">Senha:</label> <input
					id="password" name="password" type="password" class="form-control"
					required>
			</div>

			<button type="submit" class="btn btn-primary">Entrar</button>
		</form>

		<p class="mt-3">Ainda não tem cadastro?</p>

		<div class="d-grid gap-2">
			<a th:href="@{/cadastro-clinica}" class="btn btn-outline-primary"> Cadastrar clínica </a> 
			<a th:href="@{/cadastro-veterinario}" class="btn btn-outline-success"> Cadastrar veterinário </a>
		</div>

	</div>
</body>
</html>
