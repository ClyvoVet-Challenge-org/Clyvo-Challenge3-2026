<!DOCTYPE  html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Todos Responsáveis</title>
</head>
<body>
	<div class="container">
        <div class="row">
            <h1>Lista de Responsaveis</h1>
        </div>
        <div class="row">
            <div class="col-12">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th scope="col">Nome</th>
                            <th scope="col">CPF</th>
                            <th scope="col">n° Telefone</th>
                            <th scope="col">Email</th>
                        </tr>
                      </thead>
                    <tbody>
                        <tr th:each="responsavel : ${responsaveis}">
                            <td class="col-3" scope="row" th:text="${responsavel.nome}">A</td>
                            <td class="col-3" th:text="${responsavel.cpf}">B</td>
                            <td class="col-3" th:text="${responsavel.numeroTelefone}">C</td>
                            <td class="col-3" th:text="${responsavel.email}">D</td>
                       </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="row">
            <a href="/pessoa/nova">Cadastrar Pessoa</a>
        </div>
    </div>

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-ygbV9kiqUc6oa4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW" crossorigin="anonymous"></script>


</body>
</html>
