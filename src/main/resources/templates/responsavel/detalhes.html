<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1"
	crossorigin="anonymous">
<title>Detalhes</title>
</head>
<body>
	<div class="container">
		<div class="row">
			<h1>Responsável</h1>
			
		</div>
		<div class="row">
			<div class="col-12">
				<h2>Informações</h2>
				<table class="table table-hover">

					<tr>
						<td><b>Nome:</b></td>
						<td th:text="${responsavel.nome}"></td>
					</tr>

					<tr>
						<td><b>CPF:</b></td>
						<td th:text="${responsavel.cpf}"></td>
					</tr>

					<tr>
						<td><b>n°. Telefone:</b></td>
						<td th:text="${responsavel.numeroTelefone}"></td>
					</tr>

					<tr>
						<td><b>Email</b></td>
						<td th:text="${responsavel.email}"></td>
					</tr>

				</table>
				<br>
				<h2>Animais Associados</h2>
				<table class="table table-hover">
					<thead>
						<tr>
							<th scope="col">Nome</th>
							<th scope="col">Espécie</th>
							<th scope="col">Raça</th>
							<th scope="col">Data de Nascimento</th>
							<th scope="col">Peso (kg)</th>
							<th scope="col">RG</th>
							<th scope="col">Microchip</th>
							<th scope="col">Responsável</th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="animal : ${animais}">
							<td th:text="${animal.nome}">Rex</td>
							<td th:text="${animal.especie}">Cão</td>
							<td th:text="${animal.raca}">Vira-lata</td>
							<td
								th:text="${#temporals.format(animal.dataNascimento, 'dd/MM/yyyy')}">01/01/2020</td>
							<td th:text="${animal.peso}">10.50</td>
							<td th:text="${animal.rg ?: '-'}">-</td>
							<td th:text="${animal.numeroMicrochip ?: '-'}">-</td>
							<td th:text="${animal.responsavel?.nome}">Nome do
								Responsável</td>
						</tr>
					</tbody>
				</table>
				
				<div class="row">
					<a href="/novo">Listagem de Responsáveis</a>
				</div>

			</div>
		</div>
		<div class="row">
			<a href="/responsaveis">Listagem de Responsáveis</a>
		</div>
	</div>

	<!-- Option 1: Bootstrap Bundle with Popper -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-ygbV9kiqUc6oa4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW"
		crossorigin="anonymous"></script>
</body>
</html>
