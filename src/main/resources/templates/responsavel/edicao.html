<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1"
	crossorigin="anonymous">
<title>Edição</title>
</head>
<body>
	<div class="container">
		<div class="row">
			<h1>Editar Responsavel</h1>
		</div>
		<div class="row">

			<form th:object="${responsavel}"
				th:action="@{/responsaveis/atualizar/{idResponsavel}(idResponsavel = ${responsavel.id})}"
				method="post">
				
				<input type="hidden" name="_csrf" th:value="${_csrf.token}">

				Nome: <input class="form-control" type="text" th:field="*{nome}"><br>
				<div style="color: red;" th:if="${#fields.hasErrors('nome')}"
					th:errors="*{nome}"></div>

				CPF: <input class="form-control" type="text" th:field="*{cpf}"><br>
				<div style="color: red;" th:if="${#fields.hasErrors('cpf')}"
					th:errors="*{cpf}"></div>

				E-mail: <input class="form-control" type="text" th:field="*{email}"><br>
				<div style="color: red;" th:if="${#fields.hasErrors('email')}"
					th:errors="*{email}"></div>

				Telefone: <input class="form-control" type="text"
					th:field="*{numeroTelefone}"><br>
				<div style="color: red;"
					th:if="${#fields.hasErrors('numeroTelefone')}"
					th:errors="*{numeroTelefone}"></div>

				<h3>Endereço</h3>

				País: <input class="form-control" type="text"
					th:field="*{enderecoResponsavel.pais}"><br>
				<div style="color: red;"
					th:if="${#fields.hasErrors('enderecoResponsavel.pais')}"
					th:errors="*{enderecoResponsavel.pais}"></div>

				Estado: <input class="form-control" type="text"
					th:field="*{enderecoResponsavel.estado}"><br>
				<div style="color: red;"
					th:if="${#fields.hasErrors('enderecoResponsavel.estado')}"
					th:errors="*{enderecoResponsavel.estado}"></div>

				Cidade: <input class="form-control" type="text"
					th:field="*{enderecoResponsavel.cidade}"><br>
				<div style="color: red;"
					th:if="${#fields.hasErrors('enderecoResponsavel.cidade')}"
					th:errors="*{enderecoResponsavel.cidade}"></div>

				Bairro: <input class="form-control" type="text"
					th:field="*{enderecoResponsavel.bairro}"><br>
				<div style="color: red;"
					th:if="${#fields.hasErrors('enderecoResponsavel.bairro')}"
					th:errors="*{enderecoResponsavel.bairro}"></div>

				Logradouro: <input class="form-control" type="text"
					th:field="*{enderecoResponsavel.logradouro}"><br>
				<div style="color: red;"
					th:if="${#fields.hasErrors('enderecoResponsavel.logradouro')}"
					th:errors="*{enderecoResponsavel.logradouro}"></div>

				Número: <input class="form-control" type="text"
					th:field="*{enderecoResponsavel.numeroRua}"><br>
				<div style="color: red;"
					th:if="${#fields.hasErrors('enderecoResponsavel.numeroRua')}"
					th:errors="*{enderecoResponsavel.numeroRua}"></div>

				Complemento: <input class="form-control" type="text"
					th:field="*{enderecoResponsavel.complemento}"><br>
				<div style="color: red;"
					th:if="${#fields.hasErrors('enderecoResponsavel.complemento')}"
					th:errors="*{enderecoResponsavel.complemento}"></div>

				CEP: <input class="form-control" type="text"
					th:field="*{enderecoResponsavel.cep}"><br>
				<div style="color: red;"
					th:if="${#fields.hasErrors('enderecoResponsavel.cep')}"
					th:errors="*{enderecoResponsavel.cep}"></div>

				<button type="submit">Editar</button>

			</form>

		</div>
		<div class="row">
			<a href="/responsaveis">Home Page</a>
		</div>
	</div>

	<!-- Option 1: Bootstrap Bundle with Popper -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-ygbV9kiqUc6oa4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW"
		crossorigin="anonymous"></script>
</body>
</html>
