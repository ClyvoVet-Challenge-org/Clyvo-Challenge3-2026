<!DOCTYPE  html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml" xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Todos Animais</title>
</head>
<body>
	<div class="container">
        <div class="row">
            <h1>Lista de Animais</h1>
        </div>
        <div class="row">
            <div class="col-12">
                <table class="table table-hover">
                    <thead>
                        <tr>
                            <th scope="col">Nome</th>
                            <th scope="col">Espécie</th>
                            <th scope="col">Raça</th>
                            <th scope="col">Data de Nascimento</th>
                            <th scope="col">Peso</th>
                            <th scope="col">Responsável</th>
                            <th scope="col">#</th>
                            <th scope="col">#</th>
                        </tr>
                      </thead>
                    <tbody>
                        <tr th:each="animal : ${animais}">
                            <td class="col-3" scope="row" th:text="${animal.nome}">A</td>
                            <td class="col-3" th:text="${animal.especie}">B</td>
                            <td class="col-3" th:text="${animal.raca}">C</td>
                            <td class="col-3" th:text="${#temporals.format(animal.dataNascimento, 'dd/MM/yyyy')}">D</td>
                            <td class="col-3" th:text="${animal.peso} + ' kg'">E</td>
                            <td class="col-3" th:text="${animal.responsavel.nome}">F</td>
                            <td class="col-3"><a th:href="@{/animais/{idAnimal}(idAnimal= ${animal.id})}">Detalhes</a></td>
                            <td class="col-3"><a th:href="@{/animais/edicao/{idAnimal}(idAnimal = ${animal.id})}">Editar</a></td>
                       </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <div class="row">
            <a href="/cadastro-animal">Cadastrar Novo Animal</a>
        </div>
    </div>

    <!-- Option 1: Bootstrap Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js" integrity="sha384-ygbV9kiqUc6oa4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW" crossorigin="anonymous"></script>


</body>
</html>
