<!DOCTYPE html SYSTEM "http://www.thymeleaf.org/dtd/xhtml1-strict-thymeleaf-spring4-4.dtd">
<html xmlns="http://www.w3.org/1999/xhtml"
	xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- Bootstrap CSS -->
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css"
	rel="stylesheet"
	integrity="sha384-giJF6kkoqNQ00vy+HMDP7azOuL0xtbfIcaT9wjKHr8RbDVddVHyTfAAsrekwKmP1"
	crossorigin="anonymous">
<title>Detalhes do Animal</title>
</head>
<body>
	<div class="container">
		<div class="row">
			<h1>Animal</h1>
		</div>
		<div class="row">
			<div class="col-12">
				<h2>Informações</h2>
				<table class="table table-hover">
					<tr>
						<td><b>Nome:</b></td>
						<td th:text="${animal.nome}"></td>
					</tr>
					<tr>
						<td><b>Espécie:</b></td>
						<td th:text="${animal.especie}"></td>
					</tr>
					<tr>
						<td><b>Raça:</b></td>
						<td th:text="${animal.raca}"></td>
					</tr>
					<tr>
						<td><b>Data de Nascimento:</b></td>
						<td
							th:text="${#temporals.format(animal.dataNascimento, 'dd/MM/yyyy')}"></td>
					</tr>
					<tr>
						<td><b>Peso:</b></td>
						<td th:text="${animal.peso} + ' kg'"></td>
					</tr>
					<tr>
						<td><b>RG:</b></td>
						<td th:text="${animal.rg ?: '-'}"></td>
					</tr>
					<tr>
						<td><b>Microchip:</b></td>
						<td th:text="${animal.numeroMicrochip ?: '-'}"></td>
					</tr>
					<tr>
						<td><b>Endereço do Animal:</b></td>
						<td th:if="${animal.enderecoAnimal != null}"
							th:text="${animal.enderecoAnimal.logradouro} + ', ' + ${animal.enderecoAnimal.numeroRua} + ' - ' + ${animal.enderecoAnimal.bairro} + ', ' + ${animal.enderecoAnimal.cidade} + '/' + ${animal.enderecoAnimal.estado} + ' - CEP: ' + ${animal.enderecoAnimal.cep}">
						</td>
					</tr>
				</table>
				<br>
				<h2>Responsável</h2>
				<table class="table table-hover">
					<tr>
						<td><b>Nome:</b></td>
						<td><a
							th:href="@{/responsaveis/{id}(id=${animal.responsavel.id})}"
							th:text="${animal.responsavel.nome}"> Responsável </a></td>
					</tr>
					<tr>
						<td><b>CPF:</b></td>
						<td th:text="${animal.responsavel.cpf}"></td>
					</tr>
					<tr>
						<td><b>Telefone:</b></td>
						<td th:text="${animal.responsavel.numeroTelefone}"></td>
					</tr>
					<tr>
						<td><b>Email:</b></td>
						<td th:text="${animal.responsavel.email}"></td>
					</tr>
					<tr>
						<td><b>Endereço:</b></td>
						<td th:if="${animal.responsavel.enderecoResponsavel != null}"
							th:text="${animal.responsavel.enderecoResponsavel.logradouro} + ', ' + ${animal.responsavel.enderecoResponsavel.numeroRua} + ' - ' + ${animal.responsavel.enderecoResponsavel.bairro} + ', ' + ${animal.responsavel.enderecoResponsavel.cidade} + '/' + ${animal.responsavel.enderecoResponsavel.estado} + ' - CEP: ' + ${animal.responsavel.enderecoResponsavel.cep}">
						</td>
						<td th:unless="${animal.responsavel.enderecoResponsavel != null}">Endereço
							não cadastrado</td>
					</tr>


				</table>
				<br>
				<div class="row">
					<div class="col-12">
						<a href="/animais">Listagem de Animais</a>
					</div>
				</div>
			</div>
		</div>
	</div>
	<!-- Bootstrap Bundle with Popper -->
	<script
		src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-ygbV9kiqUc6oa4msXn9868pTtWMgiQaeYH7/t7LECLbyPA2x65Kgf80OJFdroafW"
		crossorigin="anonymous"></script>
</body>
</html>
