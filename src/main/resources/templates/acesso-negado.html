<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acesso negado - Clyvo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" th:href="@{/home}">Clyvo</a>
    </div>
</nav>

<div class="container mt-5" style="max-width: 560px;">

    <div class="card shadow-sm text-center">
        <div class="card-body p-5">

            <p class="display-1 fw-bold text-danger mb-0">403</p>

            <h1 class="h3 mb-3">Acesso negado</h1>

            <p class="text-muted mb-4">
                Você não tem permissão para acessar esta página.
                Ela pode ser exclusiva de outro tipo de conta ou de um registro
                que não está vinculado ao seu perfil.
            </p>

            <div class="d-grid gap-2 d-sm-flex justify-content-sm-center">
                <a class="btn btn-primary" th:href="@{/home}">Voltar ao início</a>

                <form th:action="@{/logout}" method="post">
                    <input type="hidden" name="_csrf" th:value="${_csrf.token}">
                    <button type="submit" class="btn btn-outline-secondary w-100">Sair</button>
                </form>
            </div>

        </div>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
