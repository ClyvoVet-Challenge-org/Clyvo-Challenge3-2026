<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <title>Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta1/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<div class="container mt-5" style="max-width: 400px;">
    <h1>Login</h1>

    <div class="alert alert-danger" th:if="${param.falha}">Email ou senha incorretos.</div>
    <div class="alert alert-success" th:if="${param.logout}">Você saiu com sucesso.</div>

    <form th:action="@{/login}" method="post">
        <label for="username">Email:</label>
        <input id="username" name="username" type="email" class="form-control" required>

        <label for="password" class="mt-2">Senha:</label>
        <input id="password" name="password" type="password" class="form-control" required>

        <button type="submit" class="btn btn-primary mt-3">Entrar</button>
    </form>
</div>
</body>
</html>
