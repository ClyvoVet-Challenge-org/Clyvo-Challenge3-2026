spring.config.import=optional:file:.env[.properties]

spring.application.name=clyvo-challenge3

server.port=${PORT:8080}
server.forward-headers-strategy=framework
# datasource
spring.datasource.driverClassName=oracle.jdbc.OracleDriver
# Dados de conexao com o banco Oracle da FIAP
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:oracle:thin:@//oracle.fiap.com.br:1521/ORCL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.hikari.maximum-pool-size=5

# Configuracao para mostrar o SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.properties.hibernate.show_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Hibernate agora so VALIDA o schema (nao cria/altera mais) -- quem cria e o Flyway
spring.jpa.hibernate.ddl-auto=none

# Flyway assume a responsabilidade de criar/popular o schema
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0
spring.flyway.table=FLYWAY_HISTORY_CLYVO4
spring.flyway.validate-migration-naming=true
spring.flyway.locations=classpath:db/migration

