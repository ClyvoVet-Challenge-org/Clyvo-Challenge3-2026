spring.config.import=optional:file:.env[.properties]

spring.application.name=clyvo-challenge3

# datasource
spring.datasource.driverClassName=com.mysql.cj.jdbc.Driver
# Dados de conexao com o banco MySQL
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

# Configuracao para mostrar o SQL no console
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.properties.hibernate.show_sql=true
spring.jpa.hibernate.naming.physical-strategy=org.hibernate.boot.model.naming.PhysicalNamingStrategyStandardImpl

# Hibernate agora so VALIDA o schema (nao cria/altera mais) -- quem cria e o Flyway
spring.jpa.hibernate.ddl-auto=none

# Flyway assume a responsabilidade de criar/popular o schema
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.validate-migration-naming=true
spring.flyway.locations=classpath:db/migration

